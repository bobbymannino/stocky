services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocky
      POSTGRES_PASSWORD: stocky
      POSTGRES_DB: stocky
    ports:
      - '5449:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stocky -d stocky']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
